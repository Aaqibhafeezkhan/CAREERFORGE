name: "Semgrep SAST"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Monday at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: read
  security-events: write  # Required to publish findings to GitHub Security tab

jobs:
  semgrep:
    name: Semgrep Static Code Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output=semgrep-results.sarif

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
