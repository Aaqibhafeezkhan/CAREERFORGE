name: "OSV-Scanner"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Monday at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: read
  security-events: write  # Required to publish findings to GitHub Security tab
  actions: read

jobs:
  scan-full:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
